# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -s escape-time 5
set -g base-index 1
set -g renumber-windows on

set -g @plugin 'thewtex/tmux-mem-cpu-load'


set -g status-position top

# Vesper theme colors
set -g status-style bg='#1a1b26',fg='#a9b1d6'
set -g status-left-length 40
set -g status-left '#[bg=#1a1b26,fg=#7aa2f7,bold] #S #[bg=#1a1b26,fg=#a9b1d6] '
set -g status-right '#[bg=#1a1b26,fg=#a9b1d6] #(whoami)#[fg=#565f89]@#[fg=#a9b1d6]#h '
set -g status-right-length 80

set -g pane-border-lines simple
set -g pane-border-status top
set -g pane-border-format '┈ #{pane_title} ┈'
set -g pane-border-style fg='#414868',bg='#1a1b26'
set -g pane-active-border-style fg='#7aa2f7',bg='#1a1b26'
set -g window-style 'bg=#16161e'
set -g window-active-style 'bg=#1a1b26'

set-window-option -g window-status-format '#[bg=#1a1b26,fg=#565f89] #I #W '
set-window-option -g window-status-current-format '#[bg=#1a1b26,fg=#7aa2f7,bold] #I #W '
set-window-option -g window-status-separator ' '

bind c new-window -c "#{pane_current_path}"
run '~/.tmux/plugins/tpm/tpm'
