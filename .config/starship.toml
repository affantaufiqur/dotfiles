# Starship prompt config — ASCII/text icons

[username]
style_user = "bright-white bold"
style_root = "bright-red bold"
format = "[$user]($style) "
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bright-green bold"

[directory]
style = "bright-blue bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 8
truncate_to_repo = false
read_only = " [RO]"
read_only_style = "bright-red"
home_symbol = "~"

[git_branch]
format = "[git:$branch]($style) "
style = "bright-cyan"
symbol = ""

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "bright-yellow"
ahead = "↑${count}"
diverged = "↑${ahead_count}↓${behind_count}"
behind = "↓${count}"
conflicted = "!${count}"
untracked = "?${count}"
modified = "M${count}"
staged = "+${count}"
renamed = "R${count}"
deleted = "D${count}"
stashed = "S${count}"

[git_state]
format = "[$state($progress_current/$progress_total)]($style) "
style = "bright-magenta"

[fill]
symbol = " "
style = "bright-black"

[cmd_duration]
min_time = 500
format = "[took $duration]($style) "
style = "bright-magenta"

[status]
symbol = "x"
success_symbol = ""
format = "[$symbol]($style) "
style = "bright-red"
disabled = false
map_symbol = true

[jobs]
symbol = "&"
format = "[$symbol$number]($style) "
style = "bright-yellow"

# ── Languages ──────────────────────────────────────────

[nodejs]
format = "[node $version]($style) "
style = "bright-green"
detect_files = ["package.json", "bun.lockb", "bun.lock", "pnpm-lock.yaml", "yarn.lock"]

[bun]
format = "[bun $version]($style) "
style = "bright-yellow"
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]

[python]
format = "[py $version]($style) "
style = "bright-blue"

[rust]
format = "[rs $version]($style) "
style = "bright-red"

[golang]
format = "[go $version]($style) "
style = "bright-cyan"

[elixir]
format = "[ex $version]($style) "
style = "bright-purple"

# ── Disabled clutter ───────────────────────────────────

[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
[terraform]
disabled = true
[dotnet]
disabled = true
[ruby]
disabled = true
[java]
disabled = true
[php]
disabled = true
[perl]
disabled = true
[lua]
disabled = true
[c]
disabled = true
[cpp]
disabled = true

# ── Layout ─────────────────────────────────────────────

format = """
[╭](bold bright-black)$username$hostname$directory$git_branch$git_status$git_state$nodejs$bun$python$rust$golang$elixir$fill$cmd_duration$jobs$status
[╰](bold bright-black)$character """

[character]
success_symbol = "[>](bright-green bold)"
error_symbol = "[>](bright-red bold)"
vimcmd_symbol = "[<](bright-purple bold)"

[time]
disabled = true
