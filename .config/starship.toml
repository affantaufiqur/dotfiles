format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"

[username]
style_user = "bright-white bold"
style_root = "bright-red bold"
format = "[$user]($style)"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bright-green bold"

[directory]
style = "bright-blue bold"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = false
read_only = "!"
read_only_style = "bright-red"

[git_branch]
format = "[$symbol$branch]($style) "
style = "bright-cyan"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bright-yellow"
ahead = "↑${count}"
diverged = "↑${ahead_count}↓${behind_count}"
behind = "↓${count}"
conflicted = "✖${count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "≡${count}"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bright-magenta"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bright-yellow"

[character]
success_symbol = "[>](bright-green bold)"
error_symbol = "[>](bright-red bold)"
vimcmd_symbol = "[<](bright-purple bold)"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M"

[python]
format = "[py:$version]($style) "
style = "bright-green"

[nodejs]
format = "[node:$version]($style) "
style = "bright-green"

[rust]
format = "[rs:$version]($style) "
style = "bright-red"


# Disable unnecessary modules
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

